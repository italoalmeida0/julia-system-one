name: verify published

# Installs a PUBLISHED version from the real npm registry and uses it, on
# every platform we claim to support. This is the test that cannot be faked
# locally: it proves that npm's own selection (os/cpu in optionalDependencies)
# picks the right package out of the registry, that the binary arrives and
# runs, that the model chunks assemble, and that inference answers correctly.
#
# Run it after publishing an alpha, before promoting to latest:
#
#   gh workflow run verify-published.yml -f version=1.0.0 -f tag=latest
#
# Coverage:
#   linux glibc x64/arm64     native binary
#   linux musl  x64/arm64     native binary (container, real Alpine)
#   windows x64/arm64         native binary
#   macos arm64/x64           native binary
#   each of the above in Node, and once more under Bun

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact published version (e.g. 1.0.0)'
        required: true
      tag:
        description: 'dist-tag it was published under'
        required: false
        default: 'alpha'

concurrency:
  group: verify-published-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # native platforms: install from npm and run for real
  # ------------------------------------------------------------------
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'linux-x64 glibc',   os: ubuntu-latest,    slot: linux-x64,     bin: julia-serve }
          - { name: 'linux-arm64 glibc', os: ubuntu-24.04-arm, slot: linux-arm64,   bin: julia-serve }
          - { name: 'win32-x64',         os: windows-latest,   slot: win32-x64,     bin: julia-serve.exe }
          - { name: 'win32-arm64',       os: windows-11-arm,   slot: win32-arm64,   bin: julia-serve.exe }
          - { name: 'darwin-arm64',      os: macos-latest,     slot: darwin-arm64,  bin: julia-serve }
          - { name: 'darwin-x64',        os: macos-15-intel,   slot: darwin-x64,    bin: julia-serve }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - name: Install from the registry (nothing cached, nothing local)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p verify && cd verify
          npm init -y >/dev/null
          npm install "julia-system-one@$VERSION" --no-audit --no-fund
          echo "--- installed @sys-one packages ---"
          ls node_modules/@sys-one/ | sort

      - name: Exactly the right platform package arrived
        shell: bash
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          cd verify
          SPECIFIC=$(ls node_modules/@sys-one/ | grep '^julia-serve-' | grep -v universal || true)
          COUNT=$(echo "$SPECIFIC" | grep -c . || true)
          echo "specific platform packages: $SPECIFIC"
          [ "$COUNT" -eq 1 ] || { echo "expected exactly one, got $COUNT"; exit 1; }
          [ "$SPECIFIC" = "julia-serve-$SLOT" ] || { echo "expected julia-serve-$SLOT"; exit 1; }

      - name: The model chunks arrived
        shell: bash
        run: |
          set -euo pipefail
          # The expected count comes from the manifest inside the INSTALLED
          # package, not a literal and not the repo: this job installs from the
          # registry and never checks the repository out. The count was
          # hardcoded to 13 (the checkpoint this runtime was first built for)
          # and every job failed against a model that ships 6.
          cd verify
          WANT=$(node -p "require('./node_modules/julia-system-one/models/model.manifest.json').chunkCount")
          N=$(ls -d node_modules/@sys-one/julia-model-chunk-* | wc -l)
          echo "chunk packages: $N (expected $WANT)"
          [ "$N" -eq "$WANT" ] || { echo "expected $WANT chunks, got $N"; exit 1; }

      - name: Binary is present and executable
        shell: bash
        env:
          SLOT: ${{ matrix.slot }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          cd verify
          B="node_modules/@sys-one/julia-serve-$SLOT/bin/$SLOT/$BIN"
          ls -la "$B"
          if [ "${{ runner.os }}" != "Windows" ]; then
            test -x "$B" || { echo "binary is not executable"; exit 1; }
          fi
          "$B" --help 2>&1 | head -2

      - name: Node — install, load and answer 10 questions
        shell: bash
        env:
          JULIA_REQUIRE_MODEL: '1'
        run: |
          set -euo pipefail
          cd verify
          cat > check.mjs <<'JS'
          import { Julia } from 'julia-system-one';
          // Verified against the reference implementation (Python + ONNX
          // Runtime) on this model: cases where the model genuinely disagrees
          // with a human label are left out, because this check is here to
          // prove the build works, not to grade the model.
          // What this check can assert, and what it cannot:
          //
          //   can:     the binary starts, loads the model, answers every
          //            prompt, returns a valid label, probabilities sum to 1,
          //            and repeating a prompt repeats the answer
          //   cannot:  accuracy. This model is INT8 with dynamic quantization,
          //            and ONNX Runtime's kernels differ per architecture - the
          //            same build answered 5/10 in one run and 8/10 in the
          //            next, on the same platform. A label gate fails healthy
          //            builds and passes broken ones by luck.
          const cases = [
            'I was charged the wrong amount on my last invoice.',
            'We were billed twice on the March invoice and want a refund.',
            'Me cobraron dos veces en mi factura y quiero un reembolso.',
            'I was charged twice for the same subscription this month.',
            'The application crashes with a segfault when I open the settings page.',
            'The app freezes and throws an exception on startup.',
            'Your service has been down for six hours and nobody answers.',
            'Need help resetting my password, the email never arrives.',
            'The software crashes every time I click save.',
            'The dashboard shows an error when I export the report.'
          ];
          const q = { department: { type: 'choice', instructions: 'Which department should handle this?',
            criteria: { billing: 'refunds and invoices', tech: 'bugs and crashes', sales: 'upgrades and contracts' } } };
          const valid = new Set(Object.keys(q.department.criteria));

          const t0 = Date.now();
          const julia = await Julia.load({ backend: 'native' });
          let pass = 0;
          const answers = [];
          for (const prompt of cases) {
            const a = (await julia.predict(prompt, q)).answers.department;
            const sum = Object.values(a.probabilities || {}).reduce((x, y) => x + y, 0);
            const ok = valid.has(a.choice) && Math.abs(sum - 1) < 0.02;
            if (ok) pass++; else console.log('  malformed', { prompt, got: a.choice, sum });
            answers.push(a.choice);
          }
          const repeat = (await julia.predict(cases[0], q)).answers.department.choice;
          const deterministic = repeat === answers[0];
          console.log(`well-formed: ${pass}/${cases.length} in ${((Date.now()-t0)/1000).toFixed(1)}s`);
          console.log(`deterministic: ${deterministic ? 'yes' : 'NO'}`);
          await julia.close();
          if (pass < cases.length || !deterministic) {
            console.error(`FAILED: ${pass}/${cases.length} well-formed, deterministic=${deterministic}`);
            process.exit(1);
          }
          JS
          node check.mjs

      - name: The model is the one this package ships
        # /health reports the encoder and the sha256 of the model actually
        # loaded. Comparing them against the manifest proves the install
        # assembled the right checkpoint rather than serving something else.
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          cat > identity.mjs <<'JS'
          import { serve } from 'julia-system-one';
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('node_modules/julia-system-one/models/model.manifest.json', 'utf8'));
          const cfg = JSON.parse(fs.readFileSync('node_modules/julia-system-one/models/rl_agent_config.json', 'utf8'));

          const srv = await serve({ port: 0, warmup: false });
          const health = await (await fetch(srv.url + '/health')).json();
          await srv.close();

          console.log('encoder     :', health.encoder);
          console.log('model sha256:', health.model_sha256);
          console.log('expected    :', manifest.sha256);

          if (health.encoder !== cfg.encoder) {
            console.error(`encoder mismatch: served ${health.encoder}, config says ${cfg.encoder}`);
            process.exit(1);
          }
          if (health.model_sha256 !== manifest.sha256) {
            console.error('model sha256 mismatch: the assembled model is not the one the manifest describes');
            process.exit(1);
          }
          console.log('identity verified');
          JS
          node identity.mjs

      - name: The binary came from node_modules (no silent wasm fallback)
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          cat > where.mjs <<'JS'
          import { resolveBinaryOrNull } from 'julia-system-one/src/julia-native.js';
          const bin = resolveBinaryOrNull();
          console.log('resolved:', bin);
          if (!bin || !bin.includes('node_modules')) { console.error('not from node_modules'); process.exit(1); }
          JS
          node where.mjs

      - name: CLI works
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          npx julia-system-one --version

      - name: Bun — the same install, a different runtime
        shell: bash
        run: |
          set -euo pipefail
          cd verify
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
          fi
          bun --version
          bun check.mjs

  # ------------------------------------------------------------------
  # musl: the other libc, tested on real Alpine
  # ------------------------------------------------------------------
  musl:
    name: linux-${{ matrix.arch }} musl (alpine)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-latest,    platform: linux/amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install and run inside Alpine (node + bun)
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e VERSION -e ARCH \
            -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.22 sh /work/.github/alpine-verify.sh

  # ------------------------------------------------------------------
  # report: one place to read the outcome
  # ------------------------------------------------------------------
  summary:
    name: summary
    needs: [native, musl]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "version : ${{ inputs.version }} (tag: ${{ inputs.tag }})"
          echo "native  : ${{ needs.native.result }}"
          echo "musl    : ${{ needs.musl.result }}"
          if [ "${{ needs.native.result }}" != "success" ] || [ "${{ needs.musl.result }}" != "success" ]; then
            echo "VERIFICATION FAILED - do not promote to latest"
            exit 1
          fi
          echo "VERIFIED on every platform - safe to publish --tag latest"
